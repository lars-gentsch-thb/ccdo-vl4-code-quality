version: 2
updates:
  - package-ecosystem: maven
    directory: /code-quality-demo
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /mutation-testing
    schedule:
      interval: weekly
    ignore:
      # JUnit 6 erst, wenn pitest-junit5-plugin es offiziell unterstützt
      - dependency-name: org.junit:junit-bom
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
