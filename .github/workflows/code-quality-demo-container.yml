name: code-quality-demo Container

# Image mit Jib bauen, nach GHCR pushen und anschließend mit Trivy scannen
on:
  push:
    branches: [main]
    paths:
      - 'code-quality-demo/**'
      - '.github/workflows/code-quality-demo-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # Push nach ghcr.io mit GITHUB_TOKEN
  security-events: write   # Trivy-Ergebnisse (SARIF) im Security-Tab

jobs:
  container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code-quality-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: code-quality-demo/pom.xml

      - name: Bauen und testen
        run: ./mvnw -B verify

      - name: Image-Namen bestimmen
        # ghcr.io/lars-gentsch-thb/ccdo-vl4-code-quality (Registry verlangt Kleinbuchstaben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Image mit Jib bauen und nach GHCR pushen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./mvnw -B compile jib:build \
            -Djib.from.platforms=linux/amd64,linux/arm64 \
            -Djib.to.image="$IMAGE:${{ github.sha }}" \
            -Djib.to.tags=latest \
            -Djib.to.auth.username="${{ github.actor }}" \
            -Djib.to.auth.password="$GITHUB_TOKEN"

      # Trivy-Action per Commit-SHA gepinnt (Supply-Chain-Vorfall März 2026,
      # CVE-2026-33634 / GHSA-69fq-xp46-6x23: Tags wurden auf Schadcode umgebogen).
      - name: Trivy-Scan (SARIF für den Security-Tab)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Trivy-Ergebnisse hochladen
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Trivy-Scan als Quality Gate (CRITICAL/HIGH mit verfügbarem Fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true
