name: mutation-testing PIT

on:
  push:
    branches: [main]
    paths:
      - 'mutation-testing/**'
      - '.github/workflows/mutation-testing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mutation-testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mutation-testing/pom.xml
      - name: Bauen und testen
        run: ./mvnw -B verify
      - name: Mutation Testing mit PIT
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage
      - name: PIT-Report hochladen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pit-report
          path: mutation-testing/target/pit-reports/
          if-no-files-found: warn
