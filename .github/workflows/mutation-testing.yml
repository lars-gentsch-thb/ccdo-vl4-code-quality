name: mutation-testing PIT

on:
  push:
    branches: [main]
    paths:
      - 'mutation-testing/**'
      - '.github/workflows/mutation-testing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mutation-testing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: mutation-testing/pom.xml
      - name: Bauen und testen
        run: ./mvnw -B verify
      - name: Mutation Testing mit PIT
        run: ./mvnw -B test-compile org.pitest:pitest-maven:mutationCoverage
      - name: PIT-Report hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: mutation-testing/target/pit-reports/
          if-no-files-found: warn
